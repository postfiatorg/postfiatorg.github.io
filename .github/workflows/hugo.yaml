name: Deploy Hugo Site to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly: refresh the Hive feed and community cards from Task Node

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Install Node.js deps
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Sync Hive feed and community cards from Task Node
        run: node scripts/sync_tasknode.mjs || echo "::warning::Task Node unavailable; using committed snapshots"

      - name: Check relay-wallet guidance surfaces
        run: node scripts/check_relay_wallet_guidance.mjs
        
      - name: Build Site
        env:
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Checkout postfiatl1v2 docs source
        uses: actions/checkout@v4
        with:
          repository: postfiatorg/postfiatl1v2
          ref: main
          path: _l1v2
          fetch-depth: 1

      - name: Setup Python for L1 MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _l1v2/requirements-docs.txt

      - name: Install L1 MkDocs dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r _l1v2/requirements-docs.txt

      - name: Build postfiatl1v2 MkDocs into /docs/l1/
        run: |
          python3 scripts/build_l1_docs.py \
            --l1-dir _l1v2 \
            --out-dir public/docs/l1 \
            --site-url "${{ steps.pages.outputs.base_url }}/docs/l1/"
          python3 scripts/verify_docs_links.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
