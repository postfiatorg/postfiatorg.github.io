{{- /* A film paired with a post: native <video>, poster frame, title and an optional note.
     Usage: {{< post-video src="/video/x.mp4" poster="/video/x.jpg" title="..." duration="3:09" >}}Optional note (markdown).{{< /post-video >}} */ -}}
{{- $src := .Get "src" | relURL -}}
{{- $poster := .Get "poster" | relURL -}}
<figure class="post-video">
  <style>
    .post-video{--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;margin:1.6rem 0 2.2rem}
    .post-video .pv-frame{position:relative;overflow:hidden;border:1px solid rgba(221,255,220,.16);border-radius:8px;background:#000;aspect-ratio:16/9;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .post-video video{display:block;width:100%;height:100%;background:#000}
    .post-video figcaption{margin-top:.7rem;color:var(--pale,#ddffdc);font-size:.95rem;line-height:1.5}
    .post-video .pv-eyebrow{display:block;margin-bottom:.3rem;color:var(--green,#7fee64);font:650 .72rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
    .post-video .pv-note{display:block;margin-top:.25rem;opacity:.78}
    .post-video .pv-note p{display:inline;margin:0}
  </style>
  <div class="pv-frame">
    <video controls preload="metadata" playsinline poster="{{ $poster }}" aria-label="{{ .Get "title" }}">
      <source src="{{ $src }}" type="video/mp4">
      <a href="{{ $src }}">Download the film ({{ .Get "duration" }})</a>
    </video>
  </div>
  <figcaption>
    <span class="pv-eyebrow">&#9654; Watch &middot; {{ .Get "duration" }}</span>
    <strong>{{ .Get "title" }}</strong>
    {{- with .Inner }}<span class="pv-note">{{ . | markdownify }}</span>{{ end }}
  </figcaption>
</figure>
