<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three pieces of NAVCoin economics</title>
  <desc id="desc">A standard proof of reserves at the base produces one checked NAV. Standard liquidity is built around that NAV. Private swaps in size settle at that NAV.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d100b"/><stop offset="1" stop-color="#050604"/></linearGradient>
    <radialGradient id="wash" cx="70%" cy="12%" r="76%"><stop offset="0" stop-color="#d6f750" stop-opacity=".11"/><stop offset="1" stop-color="#d6f750" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d6f750"/></marker>
    <marker id="arrowv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c4b0f5"/></marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#98a08d"/></marker>
    <style>
      .sans{font-family:Inter,"Helvetica Neue",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.kicker{font-size:12px;letter-spacing:2.6px}.label{font-size:11px;letter-spacing:1.8px}.title{font-size:29px;font-weight:700;letter-spacing:-.5px}.node-title{font-size:16px;font-weight:700}.copy{font-size:12.5px}.big{font-size:22px;font-weight:700}.muted{fill:#98a08d}.paper{fill:#eef1e6}.lime{fill:#d6f750}.violet{fill:#c4b0f5}.red{fill:#f08a7a}
    </style>
  </defs>
  <rect x="2" y="2" width="1196" height="636" rx="28" fill="url(#panel)"/>
  <rect x="2" y="2" width="1196" height="636" rx="28" fill="url(#wash)"/>
  <rect x="2" y="2" width="1196" height="636" rx="28" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <text x="52" y="58" class="mono kicker lime">ECONOMICS OF THE NAVCOIN</text>
  <text x="52" y="98" class="sans title paper">One checked number, three ways to use it</text>
  <text x="52" y="126" class="sans copy muted">Proof sets NAV → markets hold the price on NAV → size trades privately at NAV</text>
  <rect x="52" y="176" width="800" height="124" rx="15" fill="#0b0d09" stroke="#c4b0f5" stroke-opacity=".5"/>
  <text x="76" y="206" class="mono label violet">03 · PRIVATE SWAPS IN SIZE</text>
  <text x="76" y="236" class="sans node-title paper">Block trades at NAV, settled privately on PFTL</text>
  <text x="76" y="262" class="sans copy muted">$10m into a coin whose public pool holds $2m: new units are minted at NAV,</text>
  <text x="76" y="281" class="sans copy muted">no pool touched, amounts and counterparties hidden, reserve still provable.</text>
  <rect x="52" y="322" width="800" height="124" rx="15" fill="#0b0d09" stroke="#d6f750" stroke-opacity=".5"/>
  <text x="76" y="352" class="mono label lime">02 · STANDARD LIQUIDITY</text>
  <text x="76" y="382" class="sans node-title paper">Mint and burn at NAV, a pool held near NAV, a keeper closing gaps</text>
  <text x="76" y="408" class="sans copy muted">Every NAVCoin gets the same market structure: primary market at NAV,</text>
  <text x="76" y="427" class="sans copy muted">a public pool with liquidity banded around NAV, and arbitrage that pulls price back.</text>
  <rect x="52" y="468" width="800" height="124" rx="15" fill="#0b0d09" stroke="#d6f750" stroke-opacity=".5"/>
  <text x="76" y="498" class="mono label lime">01 · STANDARD PROOF OF RESERVES</text>
  <text x="76" y="528" class="sans node-title paper">Any strategy compresses into one reserve packet</text>
  <text x="76" y="554" class="sans copy muted">A zero-knowledge proof reads every reserve account, values it under a published policy,</text>
  <text x="76" y="573" class="sans copy muted">and outputs V, S and N = V / S. Validators check it before NAV is accepted.</text>
  <rect x="900" y="176" width="248" height="416" rx="15" fill="#0b0d09" stroke="#fff" stroke-opacity=".16"/>
  <text x="924" y="206" class="mono label lime">THE ANCHOR</text>
  <text x="924" y="250" class="sans big paper">N = V / S</text>
  <text x="924" y="280" class="sans copy muted">one number per epoch,</text>
  <text x="924" y="299" class="sans copy muted">checked by every validator</text>
  <text x="924" y="352" class="sans copy muted">used by the pool, the</text>
  <text x="924" y="371" class="sans copy muted">keeper, the wallet and</text>
  <text x="924" y="390" class="sans copy muted">the private swap alike</text>
  <text x="924" y="440" class="sans copy paper">Different strategies,</text>
  <text x="924" y="459" class="sans copy paper">same packet, same markets,</text>
  <text x="924" y="478" class="sans copy paper">same price discipline.</text>
  <text x="924" y="540" class="sans copy muted">PFTL defines and proves it;</text>
  <text x="924" y="559" class="sans copy muted">other chains distribute it.</text>
  <path d="M452 322 L452 300" stroke="#98a08d" stroke-width="1.6" fill="none" marker-end="url(#arrowm)"/>
  <path d="M452 468 L452 446" stroke="#98a08d" stroke-width="1.6" fill="none" marker-end="url(#arrowm)"/>
</svg>
