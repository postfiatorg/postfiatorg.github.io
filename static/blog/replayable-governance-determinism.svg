<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Georgia, 'Newsreader', serif" role="img" aria-label="How deterministic replay works across runs">
  <rect width="1200" height="700" fill="#f2eee5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10191d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f1f"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#057f82"/></marker>
  </defs>
  <style>
    .lbl{font-family:'JetBrains Mono',Menlo,monospace;font-size:13px;letter-spacing:1.5px;fill:#10191d}
    .mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:13px;fill:#10191d}
    .t{font-size:19px;fill:#10191d}
    .s{font-size:15px;fill:#3b4648}
    .h{font-size:24px;fill:#10191d}
  </style>

  <!-- ordinary inference -->
  <text x="40" y="44" class="lbl">ORDINARY INFERENCE</text>
  <text x="40" y="72" class="s">The same prompt lands in different batches on different runs.</text>
  <rect x="40" y="94" width="200" height="56" fill="none" stroke="#10191d"/>
  <text x="140" y="127" text-anchor="middle" class="t">Same prompt</text>
  <line x1="240" y1="112" x2="300" y2="104" stroke="#7a1f1f" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="240" y1="130" x2="300" y2="150" stroke="#7a1f1f" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="305" y="86" width="230" height="36" fill="none" stroke="#7a1f1f"/>
  <text x="420" y="109" text-anchor="middle" class="s">Run 1: batched with 3 others</text>
  <rect x="305" y="134" width="230" height="36" fill="none" stroke="#7a1f1f"/>
  <text x="420" y="157" text-anchor="middle" class="s">Run 2: batched with 7 others</text>
  <line x1="535" y1="128" x2="590" y2="128" stroke="#7a1f1f" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="600" y="108" class="s">Sums are added in a different order,</text>
  <text x="600" y="128" class="s">a last-digit rounding difference flips one token,</text>
  <text x="600" y="148" class="s">and the two answers drift apart from there.</text>

  <line x1="40" y1="196" x2="1160" y2="196" stroke="#cfc8b6"/>

  <!-- pinned inference -->
  <text x="40" y="236" class="lbl">POST FIAT: PINNED, BATCH-INVARIANT INFERENCE</text>

  <rect x="40" y="262" width="190" height="150" fill="none" stroke="#10191d"/>
  <text x="135" y="296" text-anchor="middle" class="t">Published input</text>
  <text x="135" y="326" text-anchor="middle" class="s">question and facts</text>
  <text x="135" y="348" text-anchor="middle" class="s">prompt template</text>
  <text x="135" y="370" text-anchor="middle" class="s">full prior exchange</text>

  <line x1="230" y1="337" x2="268" y2="337" stroke="#10191d" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="272" y="252" width="300" height="170" fill="#e8f1ef" stroke="#057f82" stroke-width="1.5"/>
  <text x="422" y="282" text-anchor="middle" class="t">Pinned configuration</text>
  <text x="290" y="310" class="mono">model  DeepSeek V4.1 Flash @1bae0e1</text>
  <text x="290" y="332" class="mono">runtime DeepInfer, pinned build</text>
  <text x="290" y="354" class="mono">kernels batch-invariant</text>
  <text x="290" y="376" class="mono">sampling temp 0, seed 438916795</text>
  <text x="290" y="398" class="mono">layout  4 GPUs, fixed parallelism</text>

  <line x1="572" y1="300" x2="622" y2="282" stroke="#057f82" stroke-width="1.5" marker-end="url(#t)"/>
  <line x1="572" y1="376" x2="622" y2="394" stroke="#057f82" stroke-width="1.5" marker-end="url(#t)"/>

  <rect x="626" y="244" width="250" height="78" fill="none" stroke="#10191d"/>
  <text x="751" y="272" text-anchor="middle" class="t">Machine A</text>
  <text x="751" y="298" text-anchor="middle" class="s">4 × B200 GPUs, all answer</text>
  <rect x="626" y="354" width="250" height="78" fill="none" stroke="#10191d"/>
  <text x="751" y="382" text-anchor="middle" class="t">Machine B</text>
  <text x="751" y="408" text-anchor="middle" class="s">4 × B200 GPUs, all answer</text>

  <line x1="876" y1="283" x2="924" y2="320" stroke="#10191d" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="876" y1="393" x2="924" y2="356" stroke="#10191d" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="928" y="292" width="232" height="92" fill="#10191d"/>
  <text x="1044" y="324" text-anchor="middle" font-size="19" fill="#f2eee5">8 of 8 identical</text>
  <text x="1044" y="350" text-anchor="middle" class="mono" fill="#e9e4d8" style="fill:#e9e4d8">same tokens, same bytes</text>
  <text x="1044" y="370" text-anchor="middle" class="mono" style="fill:#9fd3cf">sha256 6b33b812c6b6…</text>

  <line x1="1044" y1="384" x2="1044" y2="470" stroke="#10191d" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="626" y="474" width="534" height="96" fill="none" stroke="#10191d"/>
  <text x="893" y="504" text-anchor="middle" class="t">Published with every decision</text>
  <text x="893" y="532" text-anchor="middle" class="s">per-GPU receipts · hash-chained log · verify.py</text>
  <text x="893" y="556" text-anchor="middle" class="s">Anyone can check the bytes or rerun the model</text>

  <text x="40" y="482" class="h">Why it holds</text>
  <text x="40" y="512" class="s">Batch-invariant kernels add numbers in the same order</text>
  <text x="40" y="534" class="s">however the batch is composed. With the weights, runtime,</text>
  <text x="40" y="556" class="s">seed and prompt pinned, every machine follows the same</text>
  <text x="40" y="578" class="s">path to the same output, token for token.</text>

  <line x1="40" y1="622" x2="1160" y2="622" stroke="#cfc8b6"/>
  <text x="40" y="656" class="mono">Runtime: github.com/deepseek-ai/DeepInfer</text>
  <text x="1160" y="656" text-anchor="end" class="mono">Evidence: postfiat.org/governance</text>
</svg>
