<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">Conditional QROM Security Regimes vs. Quantum Query Budget Q</title>
  <desc id="d3">Log-log plot comparing PFSH02 conditional QROM extraction bound, QROM zero-knowledge bound, SHAKE256 384-bit BHT collision reference, and the 160-bit account-address second-preimage weak link across quantum query budgets Q from 2^48 to 2^128.</desc>
  <defs>
    <style>
      .disp { font-family: "Instrument Serif", Georgia, serif; fill: #10191d; }
      .serif { font-family: "Newsreader", Georgia, serif; fill: #2c3437; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      .kicker { font-size: 11.5px; letter-spacing: 2px; font-weight: 600; fill: #03585a; }
      .h-title { font-size: 31px; fill: #10191d; }
      .sub { font-size: 14.5px; fill: #5a6062; font-style: italic; }
      .axis { font-size: 11px; fill: #5a6062; }
      .note { font-size: 11.5px; fill: #10191d; }
      .teal { fill: #03585a; }
      .ox { fill: #7a1f1f; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#f2eee5"/>
  <rect x="14" y="14" width="1172" height="572" fill="none" stroke="#cfc8b6" stroke-width="1.5"/>

  <!-- Header -->
  <text x="42" y="50" class="mono kicker">FIGURE 03 · CONDITIONAL QROM SCALING &amp; WEAKEST LINK</text>
  <text x="42" y="85" class="disp h-title">Error Probability Bounds Across Quantum Query Budgets Q</text>
  <text x="42" y="109" class="serif sub">Conditional on unreviewed Appendices A.1–A.3 &amp; B. Higher on the vertical axis means smaller adversary advantage (stronger bound).</text>
  <line x1="42" y1="124" x2="1158" y2="124" stroke="#10191d" stroke-width="1.5"/>

  <!-- Plot Area: x=110..1050 (Q=2^48..2^128), y=140..480 (240 bits down to 0 bits) -->
  <rect x="110" y="140" width="940" height="340" fill="#ebe6da" stroke="#cfc8b6" stroke-width="1"/>

  <!-- Horizontal Grid Lines (0, 40, 80, 120, 160, 200, 240 bits) -->
  <g stroke="#ded8c9" stroke-width="1">
    <line x1="110" y1="140" x2="1050" y2="140"/>
    <line x1="110" y1="196.7" x2="1050" y2="196.7"/>
    <line x1="110" y1="253.3" x2="1050" y2="253.3"/>
    <line x1="110" y1="310.0" x2="1050" y2="310.0"/>
    <line x1="110" y1="366.7" x2="1050" y2="366.7"/>
    <line x1="110" y1="423.3" x2="1050" y2="423.3"/>
  </g>

  <!-- Vertical Grid Lines (2^48, 2^64, 2^80, 2^96, 2^112, 2^128) -->
  <g stroke="#ded8c9" stroke-width="1">
    <line x1="298" y1="140" x2="298" y2="480"/>
    <line x1="486" y1="140" x2="486" y2="480"/>
    <line x1="674" y1="140" x2="674" y2="480"/>
    <line x1="862" y1="140" x2="862" y2="480"/>
  </g>

  <!-- Regime Crossover Line at Q = 2^81.28 (x = 501) -->
  <line x1="501" y1="140" x2="501" y2="480" stroke="#5a6062" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="507" y="156" class="mono axis">Crossover Q = 2⁸¹·²⁸</text>
  <text x="507" y="170" class="mono axis">Spot-check → 384b MT₁ coll.</text>

  <!-- Axes -->
  <line x1="110" y1="140" x2="110" y2="480" stroke="#10191d" stroke-width="1.6"/>
  <line x1="110" y1="480" x2="1050" y2="480" stroke="#10191d" stroke-width="1.6"/>

  <!-- Y-axis ticks & labels -->
  <g class="mono axis" text-anchor="end">
    <text x="100" y="144">2⁻²⁴⁰</text>
    <text x="100" y="201">2⁻²⁰⁰</text>
    <text x="100" y="257">2⁻¹⁶⁰</text>
    <text x="100" y="314">2⁻¹²⁰</text>
    <text x="100" y="371">2⁻⁸⁰</text>
    <text x="100" y="427">2⁻⁴⁰</text>
    <text x="100" y="484">1 (vacuous)</text>
  </g>
  <text x="34" y="315" transform="rotate(-90 34 315)" text-anchor="middle" class="mono axis" font-weight="600">BOUND ON ADVERSARY ADVANTAGE (LOG₂ SCALE)</text>

  <!-- X-axis ticks & labels -->
  <g class="mono axis" text-anchor="middle">
    <text x="110" y="500">2⁴⁸</text>
    <text x="298" y="500" font-weight="600" fill="#10191d">2⁶⁴ (ref)</text>
    <text x="486" y="500" font-weight="600" fill="#10191d">2⁸⁰</text>
    <text x="674" y="500" font-weight="600" fill="#10191d">2⁹⁶</text>
    <text x="862" y="500">2¹¹²</text>
    <text x="1050" y="500">2¹²⁸</text>
  </g>
  <text x="580" y="524" text-anchor="middle" class="mono axis" font-weight="600">QUANTUM ORACLE QUERIES Q</text>

  <!-- CURVE 1: SHAKE256 384-bit BHT Collision Reference (dotted slate) -->
  <polyline fill="none" stroke="#5a6062" stroke-width="2" stroke-dasharray="3 4"
    points="110,147.1 298,215.1 486,283.1 674,351.1 862,419.1 1030.4,480"/>

  <!-- CURVE 2: QROM Zero-Knowledge (Thm 1B, P = 2^32, flat 2^-150.60, dashed teal) -->
  <line x1="110" y1="266.6" x2="1050" y2="266.6" stroke="#057f82" stroke-width="2.4" stroke-dasharray="9 5"/>

  <!-- CURVE 3: Conditional QROM Extraction (Thm 2A / A.3, thick solid ink) -->
  <polyline fill="none" stroke="#10191d" stroke-width="3.2"
    points="110,192.4 298,237.8 486,285.1 501,289.6 674,349.3 862,417.3 1035.3,480"/>

  <!-- CURVE 4: 160-Bit Account Address Second-Preimage (Mode 3 weak link, thick oxblood) -->
  <polyline fill="none" stroke="#7a1f1f" stroke-width="3.2"
    points="110,389.3 298,434.7 486,480 1050,480"/>

  <!-- Key Data Points & Callouts -->
  <!-- Extraction points -->
  <circle cx="298" cy="237.8" r="5.5" fill="#10191d"/>
  <rect x="208" y="206" width="84" height="22" fill="#f2eee5" stroke="#10191d" stroke-width="0.8"/>
  <text x="250" y="221" text-anchor="middle" class="mono note">2⁻¹⁷⁰·⁹⁸</text>

  <circle cx="486" cy="285.1" r="5.5" fill="#10191d"/>
  <rect x="394" y="288" width="84" height="22" fill="#f2eee5" stroke="#10191d" stroke-width="0.8"/>
  <text x="436" y="303" text-anchor="middle" class="mono note">2⁻¹³⁷·⁵⁵</text>

  <circle cx="674" cy="349.3" r="5.5" fill="#10191d"/>
  <rect x="684" y="330" width="84" height="22" fill="#f2eee5" stroke="#10191d" stroke-width="0.8"/>
  <text x="726" y="345" text-anchor="middle" class="mono note">2⁻⁹²·²⁵</text>

  <circle cx="1035.3" cy="480" r="5" fill="#10191d"/>
  <text x="1035" y="466" text-anchor="end" class="mono axis">Trivial at 2¹²⁶·⁷⁵</text>

  <!-- ZK callout -->
  <rect x="742" y="240" width="292" height="22" fill="#f2eee5" stroke="#057f82" stroke-width="1"/>
  <text x="888" y="255" text-anchor="middle" class="mono note teal">QROM ZK (Thm 1B, P=2³²): 2⁻¹⁵⁰·⁶⁰ (PoW cap)</text>

  <!-- 160-bit weak link callout -->
  <circle cx="298" cy="434.7" r="6" fill="#7a1f1f"/>
  <rect x="130" y="424" width="158" height="44" fill="#f2eee5" stroke="#7a1f1f" stroke-width="1.2"/>
  <text x="140" y="442" class="mono note ox" font-weight="600">160-bit Addr: ~2⁻³²</text>
  <text x="140" y="458" class="mono axis ox">Vacuous at Q = 2⁸⁰</text>

  <!-- Legend Box -->
  <rect x="42" y="542" width="1116" height="34" fill="#ebe6da" stroke="#cfc8b6"/>
  <line x1="58" y1="559" x2="86" y2="559" stroke="#10191d" stroke-width="3.2"/>
  <text x="94" y="563" class="mono axis" fill="#10191d">Thm 2A Ext [Unrev A.3]</text>

  <line x1="296" y1="559" x2="324" y2="559" stroke="#057f82" stroke-width="2.4" stroke-dasharray="8 4"/>
  <text x="332" y="563" class="mono axis teal">Thm 1B ZK [Unrev App. B]</text>

  <line x1="552" y1="559" x2="580" y2="559" stroke="#5a6062" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="588" y="563" class="mono axis">384b BHT Coll. Ref (32Q³/2³⁸⁴)</text>

  <line x1="844" y1="559" x2="872" y2="559" stroke="#7a1f1f" stroke-width="3.2"/>
  <text x="880" y="563" class="mono axis ox">160-bit L1 Acct Addr (Mode 3)</text>
</svg>
