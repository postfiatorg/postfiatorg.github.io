<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Newsreader', serif" role="img" aria-label="Development company versus token: who decides and who oversees">
  <rect width="1200" height="760" fill="#f2eee5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10191d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f1f"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#057f82"/></marker>
  </defs>
  <style>
    .lbl{font-family:'JetBrains Mono',Menlo,monospace;font-size:13px;letter-spacing:1.5px;fill:#10191d}
    .t{font-size:24px;fill:#10191d}
    .s{font-size:16px;fill:#3b4648}
    .b{font-size:16px;fill:#10191d}
  </style>

  <text x="40" y="44" class="lbl">THE STATUS QUO ON A TYPICAL CHAIN</text>

  <!-- Dev corp -->
  <rect x="40" y="70" width="500" height="380" fill="#10191d"/>
  <text x="70" y="112" class="lbl" style="fill:#9fd3cf">EQUITY SIDE</text>
  <text x="70" y="146" font-size="23" fill="#f2eee5">Development company / foundation</text>
  <text x="70" y="178" font-size="16" fill="#cfc8b6">Owned by the founder, executives and equity investors</text>
  <text x="70" y="222" font-size="16" fill="#e9e4d8">Decides:</text>
  <text x="90" y="250" font-size="16" fill="#e9e4d8">· treasury and token sales</text>
  <text x="90" y="276" font-size="16" fill="#e9e4d8">· acquisitions and investments</text>
  <text x="90" y="302" font-size="16" fill="#e9e4d8">· partnerships, exchanges, institutions</text>
  <text x="90" y="328" font-size="16" fill="#e9e4d8">· business development and incentives</text>
  <text x="90" y="354" font-size="16" fill="#e9e4d8">· roadmap, hiring, fee capture</text>
  <text x="70" y="400" font-size="16" fill="#cfc8b6">Answers to: its private board</text>
  <text x="70" y="426" font-size="16" fill="#cfc8b6">Reasoning published: never</text>

  <!-- Token -->
  <rect x="660" y="70" width="500" height="380" fill="none" stroke="#10191d" stroke-width="1.5"/>
  <text x="690" y="112" class="lbl">TOKEN SIDE</text>
  <text x="690" y="146" class="t">Token holders and the chain</text>
  <text x="690" y="178" class="s">Holders, validators and on-chain votes</text>
  <text x="690" y="222" class="b">Decides:</text>
  <text x="710" y="250" class="b">· protocol upgrades and amendments</text>
  <text x="710" y="276" class="b">· protocol parameters</text>
  <text x="690" y="400" class="s">Process: public votes on code</text>
  <text x="690" y="426" class="s">Say over the company: none</text>

  <!-- arrows -->
  <line x1="544" y1="210" x2="652" y2="210" stroke="#10191d" stroke-width="4" marker-end="url(#a)"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" fill="#10191d">drives most</text>
  <text x="600" y="246" text-anchor="middle" font-size="15" fill="#10191d">of token value</text>

  <line x1="660" y1="330" x2="548" y2="330" stroke="#7a1f1f" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#r)"/>
  <text x="600" y="310" text-anchor="middle" font-size="15" fill="#7a1f1f">oversight</text>
  <text x="600" y="360" text-anchor="middle" font-size="15" fill="#7a1f1f">≈ zero</text>

  <!-- share bar -->
  <text x="40" y="500" class="lbl">WHERE PRICE-RELEVANT DECISIONS ARE MADE</text>
  <rect x="40" y="516" width="1010" height="36" fill="#10191d"/>
  <text x="60" y="540" font-size="16" fill="#f2eee5">Company and foundation, in private: most of them</text>
  <rect x="1050" y="516" width="110" height="36" fill="none" stroke="#10191d" stroke-width="1.5"/>
  <text x="1105" y="540" text-anchor="middle" font-size="15" fill="#10191d">on-chain</text>
  <text x="40" y="574" class="s">Illustrative proportions. On-chain votes cover code; the decisions that move the price never reach a vote.</text>

  <line x1="40" y1="604" x2="1160" y2="604" stroke="#cfc8b6"/>

  <!-- Post Fiat -->
  <text x="40" y="640" class="lbl" style="fill:#057f82">POST FIAT</text>
  <rect x="40" y="656" width="330" height="70" fill="#10191d"/>
  <text x="205" y="698" text-anchor="middle" font-size="18" fill="#f2eee5">Development company decisions</text>
  <line x1="370" y1="691" x2="430" y2="691" stroke="#057f82" stroke-width="2" marker-end="url(#t)"/>
  <rect x="434" y="656" width="372" height="70" fill="#e8f1ef" stroke="#057f82" stroke-width="1.5"/>
  <text x="620" y="687" text-anchor="middle" font-size="18" fill="#10191d">Public, replayable process</text>
  <text x="620" y="711" text-anchor="middle" font-size="14" fill="#3b4648">submission · model answer · challenges · log</text>
  <line x1="806" y1="691" x2="866" y2="691" stroke="#057f82" stroke-width="2" marker-end="url(#t)"/>
  <rect x="870" y="656" width="290" height="70" fill="none" stroke="#10191d" stroke-width="1.5"/>
  <text x="1015" y="687" text-anchor="middle" font-size="18" fill="#10191d">Token holders see it all</text>
  <text x="1015" y="711" text-anchor="middle" font-size="14" fill="#3b4648">read, audit, and act on it</text>
</svg>
