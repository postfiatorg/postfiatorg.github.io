<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Private swaps in size at NAV</title>
  <desc id="desc">A $10 million order sent through a $2 million public pool moves the price far above NAV. The same order as a private swap at NAV mints new units against new money, grows the strategy, and leaves the public pool untouched.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d100b"/><stop offset="1" stop-color="#050604"/></linearGradient>
    <radialGradient id="wash" cx="70%" cy="12%" r="76%"><stop offset="0" stop-color="#d6f750" stop-opacity=".11"/><stop offset="1" stop-color="#d6f750" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d6f750"/></marker>
    <marker id="arrowv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c4b0f5"/></marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#98a08d"/></marker>
    <style>
      .sans{font-family:Inter,"Helvetica Neue",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.kicker{font-size:12px;letter-spacing:2.6px}.label{font-size:11px;letter-spacing:1.8px}.title{font-size:29px;font-weight:700;letter-spacing:-.5px}.node-title{font-size:16px;font-weight:700}.copy{font-size:12.5px}.big{font-size:22px;font-weight:700}.muted{fill:#98a08d}.paper{fill:#eef1e6}.lime{fill:#d6f750}.violet{fill:#c4b0f5}.red{fill:#f08a7a}
    </style>
  </defs>
  <rect x="2" y="2" width="1196" height="656" rx="28" fill="url(#panel)"/>
  <rect x="2" y="2" width="1196" height="656" rx="28" fill="url(#wash)"/>
  <rect x="2" y="2" width="1196" height="656" rx="28" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <text x="52" y="58" class="mono kicker lime">PIECE 03 · PRIVATE SWAPS AT NAV</text>
  <text x="52" y="98" class="sans title paper">$10 million into a $2 million pool, at NAV</text>
  <text x="52" y="126" class="sans copy muted">The pool sets the price for small trades. The proof sets the price for size.</text>
  <rect x="52" y="176" width="520" height="420" rx="15" fill="#0b0d09" stroke="#f08a7a" stroke-opacity=".45"/>
  <text x="76" y="206" class="mono label red">THROUGH THE PUBLIC POOL</text>
  <text x="76" y="236" class="sans node-title paper">$10m order, $2m pool</text>
  <line x1="96" y1="520" x2="530" y2="520" stroke="#98a08d" stroke-opacity=".5"/>
  <line x1="96" y1="520" x2="96" y2="280" stroke="#98a08d" stroke-opacity=".5"/>
  <line x1="96" y1="470" x2="530" y2="470" stroke="#d6f750" stroke-dasharray="5 5" stroke-opacity=".7"/>
  <text x="536" y="474" class="mono label lime">NAV</text>
  <path d="M96 470 C220 466 300 452 360 420 C420 388 470 330 520 290" stroke="#f08a7a" stroke-width="2.4" fill="none"/>
  <text x="100" y="540" class="mono label muted">size bought →</text>
  <text x="120" y="300" class="sans copy red">price climbs far above NAV:</text>
  <text x="120" y="319" class="sans copy red">buyer overpays, and the trade is public</text>
  <text x="76" y="580" class="sans copy paper">Result: impossible or ruinous at this size.</text>
  <rect x="628" y="176" width="520" height="420" rx="15" fill="#0b0d09" stroke="#c4b0f5" stroke-opacity=".55"/>
  <text x="652" y="206" class="mono label violet">PRIVATE SWAP AT NAV ON PFTL</text>
  <text x="652" y="236" class="sans node-title paper">Same $10m, quoted at N</text>
  <circle cx="666" cy="277" r="12" fill="none" stroke="#c4b0f5" stroke-opacity=".8"/>
  <text x="666" y="282" class="mono label violet" text-anchor="middle">1</text>
  <text x="692" y="282" class="sans copy paper">Quote</text>
  <text x="842" y="282" class="sans copy muted">N + actual cost of the new positions</text>
  <circle cx="666" cy="333" r="12" fill="none" stroke="#c4b0f5" stroke-opacity=".8"/>
  <text x="666" y="338" class="mono label violet" text-anchor="middle">2</text>
  <text x="692" y="338" class="sans copy paper">Settle privately</text>
  <text x="842" y="338" class="sans copy muted">shielded: amount, asset, parties hidden</text>
  <circle cx="666" cy="389" r="12" fill="none" stroke="#c4b0f5" stroke-opacity=".8"/>
  <text x="666" y="394" class="mono label violet" text-anchor="middle">3</text>
  <text x="692" y="394" class="sans copy paper">Grow the strategy</text>
  <text x="842" y="394" class="sans copy muted">more stock bought, more perp shorted</text>
  <circle cx="666" cy="445" r="12" fill="none" stroke="#c4b0f5" stroke-opacity=".8"/>
  <text x="666" y="450" class="mono label violet" text-anchor="middle">4</text>
  <text x="692" y="450" class="sans copy paper">Next proof</text>
  <text x="842" y="450" class="sans copy muted">V up, S up, N unchanged</text>
  <circle cx="666" cy="501" r="12" fill="none" stroke="#c4b0f5" stroke-opacity=".8"/>
  <text x="666" y="506" class="mono label violet" text-anchor="middle">5</text>
  <text x="692" y="506" class="sans copy paper">Public pool</text>
  <text x="842" y="506" class="sans copy muted">untouched; small trades carry on</text>
  <text x="652" y="580" class="sans copy paper">Result: size at NAV, existing holders not diluted.</text>
</svg>
