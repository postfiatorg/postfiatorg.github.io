<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">NAVCoin and Glass product stack</title>
  <desc id="desc">PFTL evidence, verified inference, and deterministic policy form a shared substrate. NAVCoin provides portfolio tokens and NAV redemption. Glass provides reserve rights, liability cells, solvency specifications, and passports to institutions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071008"/><stop offset="1" stop-color="#020402"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172019"/><stop offset="1" stop-color="#0c120d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fee64"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#29372b" opacity=".42"><path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200M0 640h1200"/><path d="M100 0v700M200 0v700M300 0v700M400 0v700M500 0v700M600 0v700M700 0v700M800 0v700M900 0v700M1000 0v700M1100 0v700"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="600" y="54" text-anchor="middle" fill="#ddffdc" font-size="28" font-weight="700">ONE VERIFICATION SUBSTRATE, TWO PRODUCT SURFACES</text>
    <text x="600" y="84" text-anchor="middle" fill="#83917f" font-size="16">Glass extends NAVCoin; it does not replace it.</text>

    <rect x="70" y="125" width="480" height="275" rx="16" fill="url(#card)" stroke="#7fee64" stroke-width="2"/>
    <text x="105" y="171" fill="#7fee64" font-size="16" font-family="monospace" letter-spacing="2">FINANCIAL PRODUCT</text>
    <text x="105" y="215" fill="#ddffdc" font-size="34" font-weight="700">NAVCoin</text>
    <text x="105" y="251" fill="#bad8b6" font-size="18">One pro-rata claim on one verified portfolio</text>
    <g fill="#ddffdc" font-size="17">
      <circle cx="111" cy="294" r="4" fill="#7fee64"/><text x="128" y="300">finalized NAV and global supply</text>
      <circle cx="111" cy="332" r="4" fill="#7fee64"/><text x="128" y="338">primary issuance against counted reserves</text>
      <circle cx="111" cy="370" r="4" fill="#7fee64"/><text x="128" y="376">primary redemption at verified NAV</text>
    </g>

    <rect x="650" y="125" width="480" height="275" rx="16" fill="url(#card)" stroke="#8db7ff" stroke-width="2"/>
    <text x="685" y="171" fill="#8db7ff" font-size="16" font-family="monospace" letter-spacing="2">INSTITUTIONAL CONTROL PLANE</text>
    <text x="685" y="215" fill="#ddffdc" font-size="34" font-weight="700">Glass</text>
    <text x="685" y="251" fill="#bad8b6" font-size="18">Policy-specific eligibility for digital claims</text>
    <g fill="#ddffdc" font-size="17">
      <circle cx="691" cy="294" r="4" fill="#8db7ff"/><text x="708" y="300">ReserveRight + LiabilityCell</text>
      <circle cx="691" cy="332" r="4" fill="#8db7ff"/><text x="708" y="338">allocator-owned SolvencySpec</text>
      <circle cx="691" cy="370" r="4" fill="#8db7ff"/><text x="708" y="376">portable, expiring GlassPassport</text>
    </g>

    <path d="M550 255h82" stroke="#7fee64" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="591" y="237" text-anchor="middle" fill="#7fee64" font-size="13" font-family="monospace">GENERALIZE</text>

    <rect x="70" y="455" width="1060" height="170" rx="16" fill="#0b120c" stroke="#3f5942" stroke-width="2"/>
    <text x="600" y="492" text-anchor="middle" fill="#7fee64" font-size="15" font-family="monospace" letter-spacing="2">SHARED PFTL SUBSTRATE</text>
    <g>
      <rect x="105" y="520" width="225" height="70" rx="10" fill="#131c14" stroke="#436347"/><text x="217" y="550" text-anchor="middle" fill="#ddffdc" font-size="17" font-weight="600">Signed evidence</text><text x="217" y="574" text-anchor="middle" fill="#83917f" font-size="14">sources + provenance</text>
      <rect x="365" y="520" width="225" height="70" rx="10" fill="#131c14" stroke="#436347"/><text x="477" y="550" text-anchor="middle" fill="#ddffdc" font-size="17" font-weight="600">Verified inference</text><text x="477" y="574" text-anchor="middle" fill="#83917f" font-size="14">canonical claim graph</text>
      <rect x="625" y="520" width="225" height="70" rx="10" fill="#131c14" stroke="#436347"/><text x="737" y="550" text-anchor="middle" fill="#ddffdc" font-size="17" font-weight="600">Deterministic rules</text><text x="737" y="574" text-anchor="middle" fill="#83917f" font-size="14">arithmetic + policy</text>
      <rect x="885" y="520" width="210" height="70" rx="10" fill="#131c14" stroke="#436347"/><text x="990" y="550" text-anchor="middle" fill="#ddffdc" font-size="17" font-weight="600">PFTL state</text><text x="990" y="574" text-anchor="middle" fill="#83917f" font-size="14">status + enforcement</text>
    </g>
    <g stroke="#7fee64" stroke-width="2" marker-end="url(#arrow)"><path d="M330 555h25"/><path d="M590 555h25"/><path d="M850 555h25"/></g>
    <text x="600" y="668" text-anchor="middle" fill="#83917f" font-size="14" font-family="monospace">No new L1 required · No separate token assumed</text>
  </g>
</svg>
