<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Glass verified inference pipeline</title>
  <desc id="desc">Signed evidence is committed, normalized by a pinned confidential worker, checked by deterministic PFTL rules, and issued as an expiring passport. Challenges can dispute each layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071008"/><stop offset="1" stop-color="#020402"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fee64"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ff816e"/></marker>
  </defs>
  <rect width="1200" height="780" rx="18" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="600" y="52" text-anchor="middle" fill="#ddffdc" font-size="28" font-weight="700">VERIFIED INFERENCE IS THE NORMALIZATION LAYER</text>
    <text x="600" y="82" text-anchor="middle" fill="#83917f" font-size="16">Models structure evidence. Deterministic policy controls capital.</text>

    <g>
      <rect x="48" y="145" width="225" height="340" rx="16" fill="#101711" stroke="#3e5a41" stroke-width="2"/>
      <text x="75" y="183" fill="#7fee64" font-size="14" font-family="monospace" letter-spacing="1.5">01 / EVIDENCE</text>
      <text x="75" y="222" fill="#ddffdc" font-size="25" font-weight="700">Signed sources</text>
      <g fill="#bad8b6" font-size="16"><text x="75" y="266">Custody statements</text><text x="75" y="300">Control agreements</text><text x="75" y="334">Fund reports</text><text x="75" y="368">Liability commitments</text><text x="75" y="402">Entity credentials</text></g>
      <line x1="75" y1="430" x2="246" y2="430" stroke="#354438"/>
      <text x="75" y="458" fill="#83917f" font-size="14" font-family="monospace">content-addressed</text>

      <rect x="343" y="145" width="225" height="340" rx="16" fill="#111816" stroke="#587c87" stroke-width="2"/>
      <text x="370" y="183" fill="#8dd7e8" font-size="14" font-family="monospace" letter-spacing="1.5">02 / INFERENCE</text>
      <text x="370" y="222" fill="#ddffdc" font-size="25" font-weight="700">Pinned worker</text>
      <g fill="#bad8b6" font-size="16"><text x="370" y="266">Resolve entities</text><text x="370" y="300">Map instruments</text><text x="370" y="334">Extract legal terms</text><text x="370" y="368">Find contradictions</text><text x="370" y="402">Emit exceptions</text></g>
      <line x1="370" y1="430" x2="541" y2="430" stroke="#354438"/>
      <text x="370" y="458" fill="#83917f" font-size="14" font-family="monospace">attested receipt</text>

      <rect x="638" y="145" width="225" height="340" rx="16" fill="#131711" stroke="#846e35" stroke-width="2"/>
      <text x="665" y="183" fill="#f2ca62" font-size="14" font-family="monospace" letter-spacing="1.5">03 / POLICY</text>
      <text x="665" y="222" fill="#ddffdc" font-size="25" font-weight="700">Deterministic</text>
      <g fill="#bad8b6" font-size="16"><text x="665" y="266">Verify signatures</text><text x="665" y="300">Check assignment</text><text x="665" y="334">Apply haircuts</text><text x="665" y="368">Calculate coverage</text><text x="665" y="402">Enforce freshness</text></g>
      <line x1="665" y1="430" x2="836" y2="430" stroke="#354438"/>
      <text x="665" y="458" fill="#83917f" font-size="14" font-family="monospace">consensus-safe math</text>

      <rect x="933" y="145" width="219" height="340" rx="16" fill="#111713" stroke="#7fee64" stroke-width="2"/>
      <text x="960" y="183" fill="#7fee64" font-size="14" font-family="monospace" letter-spacing="1.5">04 / PASSPORT</text>
      <text x="960" y="222" fill="#ddffdc" font-size="25" font-weight="700">Executable state</text>
      <g fill="#bad8b6" font-size="16"><text x="960" y="266">Eligibility</text><text x="960" y="300">Exposure limit</text><text x="960" y="334">Assurance class</text><text x="960" y="368">Exceptions</text><text x="960" y="402">Expiry + status</text></g>
      <line x1="960" y1="430" x2="1125" y2="430" stroke="#354438"/>
      <text x="960" y="458" fill="#83917f" font-size="14" font-family="monospace">consumed on-chain</text>
    </g>

    <g stroke="#7fee64" stroke-width="3" marker-end="url(#arrow)"><path d="M273 315h55"/><path d="M568 315h55"/><path d="M863 315h55"/></g>

    <rect x="48" y="545" width="1104" height="150" rx="16" fill="#120d0c" stroke="#6d3932" stroke-width="2"/>
    <text x="78" y="580" fill="#ff816e" font-size="14" font-family="monospace" letter-spacing="1.5">CHALLENGE SURFACE</text>
    <g fill="#ddffdc" font-size="16"><text x="78" y="619">Source dispute</text><text x="339" y="619">Extraction dispute</text><text x="622" y="619">Policy/replay dispute</text><text x="902" y="619">Consumer violation</text></g>
    <g fill="#83917f" font-size="13"><text x="78" y="647">signature · omission · fraud</text><text x="339" y="647">citation · entity · terms</text><text x="622" y="647">math · schema · freshness</text><text x="902" y="647">ignored expiry or status</text></g>
    <g stroke="#ff816e" stroke-width="2" marker-end="url(#redarrow)"><path d="M160 545V505"/><path d="M455 545V505"/><path d="M750 545V505"/><path d="M1042 545V505"/></g>
    <text x="600" y="744" text-anchor="middle" fill="#83917f" font-size="15" font-family="monospace">Receipt proves execution provenance ≠ source truth</text>
  </g>
</svg>
